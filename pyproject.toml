[build-system]
requires = ["setuptools>=64", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse_transformers"
version = "0.0.1"
description = "Sparse Inference for transformers"
authors = [
    {name = "NimbleEdge"}
]
requires-python = ">=3.9"
dependencies = [
    "transformers==4.53.0",
    "numpy",
    "psutil",
    "optimum-onnx[onnxruntime]",
    "attrs",
    "scikit-learn",
    "accelerate",
    "datasets",
    "sentencepiece",
    "protobuf",
    "wandb",
    "ninja",
    "timm",
    "pillow",
    "lm-eval",
]

[tool.setuptools]
packages = ["sparse_transformers"] 